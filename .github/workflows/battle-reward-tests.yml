name: Battle reward policy, owner control and delivery

on:
  push:
    paths:
      - 'owner/rewards/**'
      - 'tools/assistant_modules/rewards/**'
      - 'tools/install_battle_rewards.py'
      - 'tools/package_rewards.py'
      - 'mods/battle_rewards/**'
      - 'include/sdgo/battle_reward*'
      - 'tests/test_reward*.py'
      - 'tests/test_battle_reward*.py'
      - 'docs/battle-reward-design*'
      - '.github/workflows/battle-reward-tests.yml'
  pull_request:
    paths:
      - 'owner/rewards/**'
      - 'tools/assistant_modules/rewards/**'
      - 'tools/install_battle_rewards.py'
      - 'tools/package_rewards.py'
      - 'mods/battle_rewards/**'
      - 'include/sdgo/battle_reward*'
      - 'tests/test_reward*.py'
      - 'tests/test_battle_reward*.py'
      - 'docs/battle-reward-design*'
      - '.github/workflows/battle-reward-tests.yml'

permissions:
  contents: read

jobs:
  preview:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Exact calculations, policy storage and same-port HTTP module
        run: python -B -m unittest discover -s tests -p "test_battle_reward*.py" -v
      - name: Owner launcher, registry, durable jobs and wallet contracts
        run: python -B -m unittest discover -s tests -p "test_reward*.py" -v
      - name: Offline MVP example
        run: python -B -m owner.rewards.preview --scenario owner/rewards/examples/pvp-mvp.json
