<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDGO Mod Manager</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="manager-shell"><aside class="manager-nav"><a class="brand" href="/">SDGO<span>MOD MANAGER</span></a><div class="mode-badge" id="mode-label">日常管理</div><button class="nav-item selected" id="nav-mods">游戏功能</button><div id="provider-nav"></div><button class="nav-item" id="nav-services">后台任务</button><button class="nav-item" id="nav-archive">修复归档</button><div class="nav-bottom"><button id="change-mode" class="quiet">显示开发信息</button><button id="exit-manager" class="quiet">退出管理器</button><small>游戏仍使用原来的启动方式</small></div></aside>
<div class="manager-main"><header class="manager-header"><div><small class="eyebrow" id="eyebrow">你的单机版</small><h1 id="page-title">我的 Mod</h1></div><div class="host-tools"><select id="host-select" aria-label="选择客户端"></select><button id="add-host">添加客户端</button></div></header>
<div id="manager-message" role="status"></div><main id="content"></main></div></div><dialog id="path-dialog"><form method="dialog"><h2 id="path-title">添加客户端</h2><p>选择含有游戏 EXE 的目录。配置只保存在本机。</p><label>目录路径<input id="host-path" placeholder="D:\Games\SDGO" required></label><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-host" value="default" class="primary">添加</button></div></form></dialog>
<script type="module" src="/app.js"></script></body></html>
