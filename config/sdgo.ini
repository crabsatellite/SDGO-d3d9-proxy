; Global SDGO mod framework settings. Lives at sdgo\sdgo.ini next to the host executable
; (GOnline.exe for the client; BattleServer/AgentServer/WorldServer.exe for servers).

[core]
; 0 debug, 1 info, 2 warn, 3 error. Log file: sdgo\logs\sdgo.log (previous run: sdgo.prev.log).
log_level=1

[loader]
; The loader DLL (d3d9.dll in the game folder, winmm.dll in a server folder) forwards
; the real functions to the system copy in system32. If another wrapper was installed under
; the same name (a graphics or input mod), rename it and name it here; the path is relative
; to the exe folder. The install scripts do this automatically.
; chain_d3d9=d3d9_chain.dll
; chain_winmm=winmm_chain.dll

[categories]
; Disable a whole category: fixes, gameplay, network, development.
; Existing per-mod defaults still apply (diagnostics stay off).
; gameplay=0
; network=0
; development=0

[features]
; A feature groups all of its client/server mods. Apply on each relevant host.
; coop-wingmen=0
; pvp-ai=0
; rank-progression-fix=0
; room-random=0

[mods]
; Turn a mod off without deleting it: <mod id>=0
; mission_ai=0
; ime_fix=0
; findwindow_fix=0
; startup_crash_fix=0
; net_probe=0
; coop_ai=0
; match_ai=0
; pvp_ai=0
; rank_progression_fix=0
; room_random=0
