; Global SDGO mod framework settings. Lives at sdgo\sdgo.ini next to the host executable
; (GOnline.exe for the client, BattleServer.exe for a battle server).

[core]
; 0 debug, 1 info, 2 warn, 3 error. Log file: sdgo\logs\sdgo.log (previous run: sdgo.prev.log).
log_level=1

[loader]
; The loader DLL (d3d9.dll in the game folder, winmm.dll in a battle server folder) forwards
; the real functions to the system copy in system32. If another wrapper was installed under
; the same name (a graphics or input mod), rename it and name it here; the path is relative
; to the exe folder. The install scripts do this automatically.
; chain_d3d9=d3d9_chain.dll
; chain_winmm=winmm_chain.dll

[mods]
; Turn a mod off without deleting it: <mod id>=0
; mission_ai=0
; ime_fix=0
; findwindow_fix=0
; coop_ai=0
