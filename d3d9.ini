; ============================================
; SDGO D3D9 Proxy - 画质增强配置
; ============================================
; 将此文件与 d3d9.dll 放在同一目录
; 修改后重启游戏生效

[General]
; 启用日志输出到 d3d9_proxy.log
EnableLog=1

[Quality]
; 强制各向异性过滤（大幅提升远处纹理清晰度）
ForceAnisotropic=1
; 各向异性等级: 2, 4, 8, 16
AnisotropicLevel=16
; 强制三线性 Mipmap 过滤
ForceTrilinear=1

[FXAA]
; 快速近似抗锯齿（仅对3D场景生效，不影响UI文字）
Enable=1

[Bloom]
; 泛光效果（高亮区域向周围溢出光晕）
Enable=1
; 亮度阈值 (越低=更多区域发光, 0.5~1.0)
Threshold=0.7
; 泛光强度 (0.1~1.0)
Intensity=0.4

[Sharpen]
; 对比度自适应锐化 (CAS)
Enable=1
; 锐化强度 (0.2~1.5, 推荐0.5~0.8)
Strength=0.6

[Tonemap]
; 色调映射与颜色校正
Enable=1
; 曝光度 (默认 1.0, 增大=更亮)
Exposure=1.0
; Gamma (默认 1.0, >1 更亮, <1 更暗)
Gamma=1.0
; 饱和度 (默认 1.0, >1 更鲜艳)
Saturation=1.15
; 对比度 (默认 1.0, >1 更高对比度)
Contrast=1.05

[NormalMap]
; 法线贴图注入 (PBR细节增强)
; 需要 normals/ 目录包含 _normalmap.txt 和 DDS 法线贴图
Enable=0
; 法线贴图强度 (0.0=关闭, 0.5=默认, 1.0=最强)
Strength=0.5
; 光源方向 (切线空间, 默认从右上前方照射)
LightX=0.2
LightY=0.3
LightZ=0.7
; 法线贴图目录 (相对于游戏目录)
Directory=normals

; ============================================
; 以下为可插拔 Mod 配置
; 每个 Mod 都是独立的 DLL，放入/移除 mods/ 目录即可启用/禁用
; 参数修改后重启游戏生效
; ============================================

[SSAO]
; 屏幕空间环境光遮蔽 (mod_ssao.dll)
; 为3D场景添加真实的接触阴影和环境遮蔽效果
; 采样半径 (越大=遮蔽范围越广, 0.5~3.0)
Radius=1.2
; 遮蔽强度 (越大=阴影越深, 0.3~1.5)
Strength=0.6
; 深度偏移 (防止自遮蔽, 通常不需要调整)
Bias=0.02
; 采样数量 (4/8/12, 越多越细腻但越慢)
Samples=12
; 粒子/雾气排除 - 深度梯度阈值 (越小=排除越积极, 0.1~0.5)
; 雾气、爆炸粒子、半透明特效的深度不连续，自动跳过不参与AO计算
EdgeThreshold=0.3
; 雾效遮罩 - 远距离渐隐AO避免与游戏雾效冲突
; 开始淡出的距离
FogStart=200.0
; 完全淡出的距离
FogEnd=500.0

[Outline]
; 动漫风格轮廓线增强 (mod_outline.dll)
; 在SD高达模型边缘绘制锐利的黑色描边，突出动漫质感
DepthThreshold=0.8
ColorThreshold=0.15
Width=1.5
Intensity=0.85
; 描边颜色 (偏紫的深黑色，比纯黑更有质感)
ColorR=0.05
ColorG=0.03
ColorB=0.08
; 距离衰减 (远处轮廓线变细)
DistanceFade=0.005

[DoF]
; 景深效果 (mod_dof.dll)
; 仅模糊远处物体，近处保持清晰
; 焦距 (低于此距离的物体保持清晰)
FocusDistance=60.0
; 模糊强度 (CoC缩放, 越大=远处越模糊)
Aperture=6.0
; 最大模糊量
MaxBlur=6.0
; 对焦过渡区域宽度 (越大=过渡越平滑)
FocusFalloff=200.0

[MotionBlur]
; 运动模糊 (mod_motionblur.dll)
; 径向模糊模拟高速移动的速度感
; 强度 (0.01=微妙, 0.03=明显)
Intensity=0.015
; 深度影响 (远处物体模糊更多)
DepthInfluence=0.008
; 最大模糊量
MaxBlur=0.03
CenterX=0.5
CenterY=0.5

[GodRays]
; 体积光散射 (mod_godrays.dll)
; 从光源位置向外放射的光线效果，非常震撼
; 光源屏幕位置 (0~1, 通常放在画面上方)
LightX=0.5
LightY=0.15
; 光线密度
Density=0.85
; 衰减率 (越大=光线越长)
Decay=0.96
; 权重
Weight=0.35
; 曝光
Exposure=0.40
; 高光提取阈值 (越低=更多光线)
Threshold=0.65
; 整体强度
Intensity=1.2
; 光线颜色 (暖色=阳光感)
TintR=1.0
TintG=0.93
TintB=0.76

[ColorGrade]
; 电影级色彩校正 (mod_colorgrade.dll)
; 完整的 Lift/Gamma/Gain + 分离调色 + 胶片曲线
; 类似 DaVinci Resolve 的调色流程
Exposure=0.15
Contrast=1.15
Saturation=1.10
Vibrance=0.30
; 色温 (正值=暖色, 负值=冷色)
Temperature=0.10
; 色调 (正值=绿, 负值=品红)
Tint=0.0
; 阴影/中间/高光 RGB (三路色彩校正)
LiftR=1.0
LiftG=1.0
LiftB=1.02
GammaR=1.0
GammaG=1.0
GammaB=1.0
GainR=1.02
GainG=1.0
GainB=0.98
; 分离调色 - 阴影色调 (经典青色阴影 + 橙色高光)
ShadowTintR=-0.05
ShadowTintG=0.08
ShadowTintB=0.12
; 分离调色 - 高光色调
HighTintR=0.10
HighTintG=0.06
HighTintB=-0.04
; 分离平衡 (-1=偏阴影, 0=均衡, 1=偏高光)
SplitBalance=0.0
; ACES 胶片曲线强度 (0=线性, 1=完全胶片)
FilmicCurve=0.6

[LensEffects]
; 镜头模拟效果 (mod_lenseffects.dll)
; 模拟真实电影镜头的光学特性
; 色散 (RGB分离, 越大越明显, 0.002~0.008)
ChromaticAberration=0.001
; 桶形畸变 (负值=枕形, 正值=桶形)
BarrelDistortion=-0.01
; 胶片颗粒 (越大越明显, 0.02~0.08)
FilmGrain=0.008
GrainSize=512.0
; 变形宽银幕镜头光晕 (高亮区域水平光条)
FlareIntensity=0.08
FlareThreshold=0.85

[Vignette]
; 暗角效果 (mod_vignette.dll)
; 画面边缘渐暗，聚焦视觉中心
Intensity=0.55
Radius=0.80
Softness=0.50
; 圆度 (1.0=正圆, <1=横椭圆)
Roundness=0.85
; 暗角区域色调 (微暖色温)
TintR=0.9
TintG=0.85
TintB=0.8
TintStrength=0.2
