; Client endpoint mapping. Disabled until the host supplies actual tunnel ports.
[mod]
id=net_route
name=Network endpoint routes
version=0.2.0
api=1
dll=net_route.dll
order=10
enabled=0
hosts=GOnline-54BE1568-00C97000

[settings]
; Legacy settings remain supported when config.ini is absent.
; For distribution use config.ini; leave these two empty for route-only mode.
LoginIPv4=
LoginPort=
; 1..32 exact rules; lower-case tcp or udp, IPv4 for logical targets.
; DNS is resolved once at startup to IPv4. Restart after changing ports/DNS.
RouteCount=0
; Logs first 8 sends/receives per rule and first 32 unmapped destinations.
; No packet payload, login information or Sakura token is logged.
Trace=0
; Route1=tcp,127.0.0.1,5001,your-node.example.invalid,25001
; Route2=udp,127.0.0.1,10001,your-node.example.invalid,26017
; Add only the service endpoints actually used; native peer relay needs validation.
