; Beta networking feature. Enable with an owner-supplied profile.
; Host-only mod for AgentServer.exe, not BattleServer.exe. Default disabled.
[mod]
id=agent_udp_pool
category=network
feature=frp-distribution
channel=beta
activation=manual
files=config.example.ini
config_files=config.ini
toolkit=frp
name=Agent native UDP port pool
version=0.2.0
api=1
dll=agent_udp_pool.dll
order=10
enabled=0
hosts=AgentServer-548A86BC-000D7000
requires=agent.udp_bind_call,agent.bind_import,agent.relay_log_format

[settings]
; config.ini is authoritative when present. These are legacy defaults.
; Shared bounded local ports. Configure one Sakura UDP tunnel for each pool port.
; The client net_route maps every logical local port to its allocated external port.
FirstPort=10001
PortCount=16
