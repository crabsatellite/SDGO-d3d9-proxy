; Automatic native hangar capacity. Only WorldServer needs this Mod.
; Uses the host INI's DB Game name and its already authenticated SQL session.
[mod]
id=hangar_capacity
category=gameplay
feature=hangar-capacity
channel=beta
activation=automatic
name=Automatic 1200-slot hangar
version=0.1.0
api=1
dll=hangar_capacity.dll
order=60
enabled=0
hosts=WorldServer-548A86E3-0010C000
requires=hangar.capacity.get_count,hangar.capacity.connection_command,hangar.capacity.args_layout,hangar.capacity.args_bindings,hangar.capacity.request_args

[settings]
; Native base 24 + extra 1176 = minimum 1200. Larger saved values are retained.
; Per-request limits; lock wait must be shorter than the query timeout.
LockTimeoutMs=1000
QueryTimeoutSeconds=3
