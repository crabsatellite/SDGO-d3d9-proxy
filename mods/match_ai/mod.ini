; PvP AI players, client side. The battle server mod pvp_ai adds AI pilots to PvP rooms
; whose title has !ai (see sdgo/mods/pvp_ai/mod.ini on the server); this mod spawns their
; units in the PvP game modes (normal, death match, grid, leader and tag match) with the
; steps the game's AI battle mode uses. They fly with the AI battle bots' own AI.
; The AI runs on the room master's client; the other clients show copies of the units.

[mod]
id=match_ai
name=PvP AI players (client)
version=0.1.0
api=1
dll=match_ai.dll
order=110
hosts=GOnline-54BE1568-00C97000
requires=CNormalGameMode.vtbl.Init,CDeathMatchGameMode.vtbl.Init,CGridMatchGameMode.vtbl.Init,CLeaderMatchGameMode.vtbl.Init,CTagMatchGameMode.vtbl.Init,mode.base_create_npc,game.unit_manager,game.is_network,um.find_start_point,um.is_observer,um.set_player_info,um.player_slot,wstring.assign,um.add_ai_unit,um.add_object,um.calculate_team,game.service_game_ready,npc.enable_ai,waitroom.battle_udp_setup,lua.register_bindings,game.app,ainormal.lock_target,ainormal.run_lua_function,lua.search_lock_player_a,lua.search_lock_player,lua.search_lock_player_aibs,lua.search_lock_target_select,lua.game_interface_run_lua_function,lua.our_team_target_search,um.object_id_from_pilot,um.set_slot_colour,um.find_object,um.is_player_object,um.set_player_count,um.find_player,um.update_dead_npc_list,um.update_dead_npc_pool,unit.init_deck_check,unit.init_deck_skip,unit.switch_deck_skill_check,unit.switch_deck_skill_skip,mode.dead_view_players,crt.operator_new,game.dead_unit_life_cost,grid.data,grid.find,unit.add_deck_unit,unit.switch_deck,game.playback_unit,service.dispatch_packet,game.nat_check

[settings]
; 1 logs the first 30 error codes the client names (server and client error popups) with
; their callers, to trace disconnects (diagnostic).
LogErrors=0
; 1 logs Lua errors of unit AI, the game's own log and server packet opcodes after AI
; players spawn, and the first access violations with address and registers (diagnostic).
LogDiagnostics=0
