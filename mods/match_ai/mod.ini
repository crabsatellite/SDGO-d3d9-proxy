; PvP AI players, client side. The battle server mod pvp_ai adds AI pilots to PvP rooms
; whose title has !ai (see sdgo/mods/pvp_ai/mod.ini on the server); this mod spawns their
; units in the PvP game modes (normal, death match, grid, leader and tag match) with the
; steps the game's AI battle mode uses. They fly with the AI battle bots' own AI.
; Version 0.1: the AI players run and are shown on the room master's client only.

[mod]
id=match_ai
name=PvP AI players (client)
version=0.1.0
api=1
dll=match_ai.dll
order=110
hosts=GOnline-54BE1568-00C97000
requires=CNormalGameMode.vtbl.Init,CDeathMatchGameMode.vtbl.Init,CGridMatchGameMode.vtbl.Init,CLeaderMatchGameMode.vtbl.Init,CTagMatchGameMode.vtbl.Init,mode.base_create_npc,game.unit_manager,game.is_network,um.find_start_point,um.is_observer,um.set_player_info,um.player_slot,wstring.assign,um.add_ai_unit,um.calculate_team

[settings]
