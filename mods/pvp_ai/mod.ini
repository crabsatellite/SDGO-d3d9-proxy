; PvP AI players, battle server side. When a PvP room starts (every battle mode except the
; co-op missions 5/8/10 and the native AI modes 11/12) and its title asks for AI players,
; AI pilots join either team in free slots, the way the server's AI battle mode adds its
; own. The checks that count humans (at least 2 players, equal teams, at least three per
; team in some modes) are skipped for such a room, as they are for co-op missions. The
; client mod match_ai spawns their units.
; Room title commands (the title holds 20 bytes):
;   !ai        fill both teams up to FillTeamSize players each
;   !aiN       N enemies
;   eN         N enemies (the team the room host is not on)
;   aN         N allies (the room host's team)
;   lvN        unit level 1-5 (pools below)
;   examples: "!ai e3 lv4", "!ai e2 a1", "!ai3"
; Changes need a battle server restart.
; Values cannot carry inline comments.

[mod]
id=pvp_ai
name=PvP AI players (server)
version=0.1.0
api=1
dll=pvp_ai.dll
order=110
hosts=BattleServer-548A891D-0046C000
requires=battle.end,battle.start_size_check,battle.start_size_checked,battle.start_team_checks,battle.start_checks_passed,battle.setup_humans,battle.room_tick,battle.respawn_pilot,battle.respawn_refresh,battle.pilot_state_respawn,battle.ai_npc_list,battle.waitroom_proc,battle.build_ai_pilot,battle.pilot_reset,battle.pilot_state_id,battle.pilot_state_room,battle.pilot_state_mode,battle.setup_ai_pilot

[settings]
; Level used when the title has no lvN.
DefaultLevel=2
; Players per team (humans and AI) that a bare "!ai" fills each team up to, 1-6.
FillTeamSize=3
; Death match: life cost (of the 1000 power each pilot has) of an AI unit by its grade
; (1 C, 2 B, 3 A, 4 S). The AI battle units cost more than player units (A 500, S 606);
; these are the player units' costs (tbl_Units BattleCost), so an AI unit gets as many lives
; as a player unit of its grade. 0 keeps the AI unit's own cost.
LifeCostGrade1=250
LifeCostGrade2=334
LifeCostGrade3=455
LifeCostGrade4=556
; 1 logs mode, room type, player count, humans per team and the title at every PvP start.
LogRoom=1
; Unit pools: AI battle bot NPCs (tbl_NpcData 3604001-3607000, the AI-NPC list of the
; server). Only ids that are in the server's AI-NPC list are used. Same pools as coop_ai.
; lv1: NpcPoint 4, HP <= 13000 (Dynames, Nadleeh, Exia 7S, Sword Calamity, Launcher Strike,
;      Palace Athene, Sword Strike, Deathscythe Hell, Blitz, Berga-Giros)
Level1=3604020,3604007,3604010,3604012,3604023,3604026,3604011,3604028,3604029,3604030
; lv2: NpcPoint 4, HP 13200-14000 (Brave test type, Blu Duel, Aile Strike, Vigna Ghina,
;      Gundam MC, Hyaku Shiki)
Level2=3604022,3604024,3604004,3604005,3604006,3604002
; lv3: mobile armors (Val-Walo, Big-Zam, Psycho Gundam, Apsalus II)
Level3=3604015,3604016,3604017,3604018
; lv4/lv5: NpcPoint 5 (Strike Freedom, Zeta awakened, Crossbone X3, Sandrock EW, Infinite
;      Justice, Seravee, Master Gundam, Deathscythe Hell EW, Heavy Arms EW, Neue Ziel)
Level4=3604001,3604003,3604008,3604009,3604019,3604021,3604027,3604025,3604014,3604013
Level5=3604001,3604003,3604008,3604009,3604019,3604021,3604027,3604025,3604014,3604013
