; Copy to config.ini to customize. Updates must preserve config.ini.
; Applies within two seconds while AI units are thinking.
[settings]
Enabled=1
DecisionMs=150
ReactionMs=300
StuckMs=1400
ProgressDistance=30
ArrivalDistance=100
RecoveryDistance=350
RecoveryMs=650
RecoveryCooldownMs=1000
; Ranged bots back away below this distance when not in an attack/combo.
RangedMinDistance=450
; Milliseconds between range-control or attack-state transitions.
TacticCooldownMs=900
; 1 logs changes and reasons, rate-limited per NPC. No per-frame log.
LogDecisions=0
