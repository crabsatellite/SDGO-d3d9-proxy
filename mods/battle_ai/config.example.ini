; Copy to config.ini to customize. Updates must preserve config.ini.
; Applies within two seconds while AI units are thinking.
[settings]
Enabled=1
; Default requires no per-client config. Room !ai/!aiN easy|medium|hard overrides.
; Easy: original AI. Medium+: continuous decisions, aim and legal specials.
; Hard adds advanced tactics. The zero-delay keys below are enforced for Medium+,
; including old config.ini values. Native weapon/action restrictions still apply.
Difficulty=Medium
DecisionMs=0
ReactionMs=0
AttackIntervalMs=0
BurstMs=0
BurstPauseMs=0
TargetHoldMs=0
FarTargetSlack=900
FarTargetRatioPercent=200
WeaponHoldMs=0
; Native boost/jump/motor permissions and resource consumption still apply.
AirStrafe=1
StrafeSwitchMs=450
StrafeDistance=400
JumpMs=600
JumpCooldownMs=1500
BoostReservePercent=20
ThreatMemoryMs=1600
TargetMemoryMs=2500
PatrolMs=1600
; Correct native shot ray and lead validated physical projectiles. No forced hits.
AimAssist=1
ProjectileLead=1
MaxLeadMs=3000
RepathMs=700
StuckMs=1400
ProgressDistance=30
ArrivalDistance=100
RecoveryDistance=350
RecoveryMs=650
RecoveryCooldownMs=1000
; Hard advanced tactics use native action/animation/resource gates.
SwingCancelChance=80
CoverChance=90
CoverSearchMs=1600
CoverTimeoutMs=2200
OrbwalkStep=120
OrbwalkMs=180
FlankMs=750
; Legacy decorator settings retained for source regression.
RangedMinDistance=450
; Legacy transition throttle; Medium+ enforce zero.
TacticCooldownMs=0
; 1 logs changes and reasons, rate-limited per NPC. No per-frame log.
LogDecisions=0
