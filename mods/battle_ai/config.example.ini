; Copy to config.ini to customize. Updates must preserve config.ini.
; Applies within two seconds while AI units are thinking.
[settings]
Enabled=1
; Default requires no per-client config. Room !ai/!aiN easy|medium|hard overrides.
; Easy: original AI. Medium+: precise/lead aim and legal specials. Hard: all tactics.
Difficulty=Medium
DecisionMs=100
ReactionMs=180
; Extra AI intent interval, not a weapon cooldown/ammo override.
AttackIntervalMs=120
BurstMs=900
BurstPauseMs=100
TargetHoldMs=600
FarTargetSlack=900
FarTargetRatioPercent=200
WeaponHoldMs=450
; Native boost/jump/motor permissions and resource consumption still apply.
AirStrafe=1
StrafeSwitchMs=450
StrafeDistance=400
JumpMs=600
JumpCooldownMs=1500
BoostReservePercent=20
ThreatMemoryMs=1600
TargetMemoryMs=2500
PatrolMs=1600
; Correct native shot ray and lead validated physical projectiles. No forced hits.
AimAssist=1
ProjectileLead=1
MaxLeadMs=3000
RepathMs=700
StuckMs=1400
ProgressDistance=30
ArrivalDistance=100
RecoveryDistance=350
RecoveryMs=650
RecoveryCooldownMs=1000
; Hard advanced tactics use native action/animation/resource gates.
SwingCancelChance=80
CoverChance=90
CoverSearchMs=1600
CoverTimeoutMs=2200
OrbwalkStep=120
OrbwalkMs=180
FlankMs=750
; Legacy decorator settings retained for source regression.
RangedMinDistance=450
; Milliseconds between range-control or attack-state transitions.
TacticCooldownMs=900
; 1 logs changes and reasons, rate-limited per NPC. No per-frame log.
LogDecisions=0
