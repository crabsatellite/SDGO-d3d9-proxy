; Normal FindWindowW for code other than the game. The repack's SDPlus.dll replaces
; FindWindowW with a check that returns bogus handles and crashes on a NULL class name,
; which hangs or crashes input methods (and other DLLs) that look up a window. Calls from
; GOnline.exe and SDPlus.dll keep SDPlus's behaviour (it lets several clients run).
; Needs the sdgo/core.dll of the same release (HookSystemExport).

[mod]
id=findwindow_fix
name=FindWindowW fix
version=1.0.0
api=1
dll=findwindow_fix.dll
order=5
hosts=GOnline-54BE1568-00C97000

[settings]
; 1 logs the handle returned for every external window lookup (no window names).
; 0 logs only the first successful one.
Trace=0
