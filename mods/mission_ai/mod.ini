; Mission AI wingmen, client side. The battle server mod coop_ai adds AI pilots to co-op
; mission rooms whose title has !ai (see sdgo/mods/coop_ai/mod.ini on the server); this
; mod spawns them like the AI battle mode does, so they are real players of the battle
; and run the AI battle bots' own AI.
; Edits to this file and to mission_ai.lua apply within 2 seconds, even mid-mission.
; Every key in [settings] reaches the script as SDGO_MissionAI_Config.<key>.
; Comments must stay on their own lines; values cannot carry inline comments.

[mod]
id=mission_ai
category=gameplay
feature=coop-wingmen
channel=stable
activation=room-title
files=mission_ai.lua
name=Mission AI wingmen
version=2.0.1
api=1
dll=mission_ai.dll
order=100
hosts=GOnline-54BE1568-00C97000
requires=CMissionMode.Init,CMissionMode.vtbl,CMissionMode.vtbl.Update,game.unit_manager,game.is_network,um.find_start_point,um.is_observer,mode.create_npc,mode.create_remote_npc,um.set_player_info,um.player_slot,wstring.assign,um.add_ai_unit,um.calculate_team,lua_tinker.state,lua_tinker.push_mode,lua.gettop,lua.settop,lua.type,lua.tonumber,lua.tostring,lua.pushnumber,lua.pushstring,lua.pushcclosure,lua.gettable,lua.settable,lua.pcall,lua.load

[settings]
; 1: an enemy whose nearest wingman is closer than its target (and within EnemyAggroRange)
; attacks the wingman. Mission enemy scripts otherwise only ever pick human players.
EnemiesTargetWingmen=1
EnemyAggroRange=2500
; 1 logs every wingman's HP and target every 5 s to sdgo/logs/sdgo.log.
LogCombat=0
