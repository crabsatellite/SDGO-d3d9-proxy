; Diagnostic: logs outgoing packets (first MaxPerOpcode per opcode, hex dump) to
; sdgo/logs/sdgo.log. Used to map attack/damage packets. Off by default; switch it on
; with enabled=1 below (or off again with sdgo/sdgo.ini [mods] net_probe=0).

[mod]
id=net_probe
category=development
feature=net-probe
channel=stable
activation=manual
name=Network probe
version=0.1.0
api=1
dll=net_probe.dll
order=5
enabled=0
hosts=GOnline-54BE1568-00C97000
requires=net.send_packet

[settings]
MaxPerOpcode=60
DumpBytes=64
