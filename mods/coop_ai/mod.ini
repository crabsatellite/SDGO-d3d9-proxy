; Co-op mission wingmen, battle server side. When a co-op mission (room mode 5, 8, 10) starts and
; the room title asks for wingmen, AI pilots join the players' team in free slots, the way
; the server's AI battle modes add theirs. The client mod mission_ai spawns their units.
; Room title commands (the title holds 20 bytes):
;   !ai        fill the free player slots (SquadSize minus the humans)
;   !aiN       N wingmen, still capped by the free player slots
;   lvN        unit level 1-5 (pools below)
;   example: "!ai3 lv4"
; Changes need a battle server restart.
; Values cannot carry inline comments.

[mod]
id=coop_ai
name=Co-op mission AI wingmen (server)
version=1.0.0
api=1
dll=coop_ai.dll
order=100
hosts=BattleServer-548A891D-0046C000
requires=battle.start_notify,battle.ai_npc_list,battle.waitroom_proc,battle.build_ai_pilot,battle.pilot_reset,battle.pilot_state_id,battle.pilot_state_room,battle.pilot_state_mode,battle.setup_ai_pilot,battle.lobby_proc,battle.lobby_map_find,battle.lobby_room,battle.lobby_release

[settings]
; 1: only rooms whose title contains !ai get wingmen. 0: every co-op mission does.
RequireRoomCommand=1
; Wingmen for a bare "!ai": 0 fills the free player slots.
DefaultCount=0
; Player slots of a co-op mission room; wingmen never exceed SquadSize minus the humans.
SquadSize=4
; Level used when the title has no lvN.
DefaultLevel=2
; 1 logs the lobby room and parsed title at every mission start.
LogRoom=1
; Unit pools: AI battle bot NPCs (tbl_NpcData 3604001-3604030, the AI-NPC list of the
; server). Only ids that are in the server's AI-NPC list are used.
; lv1: NpcPoint 4, HP <= 13000 (Dynames, Nadleeh, Exia 7S, Sword Calamity, Launcher Strike,
;      Palace Athene, Sword Strike, Deathscythe Hell, Blitz, Berga-Giros)
Level1=3604020,3604007,3604010,3604012,3604023,3604026,3604011,3604028,3604029,3604030
; lv2: NpcPoint 4, HP 13200-14000 (Brave test type, Blu Duel, Aile Strike, Vigna Ghina,
;      Gundam MC, Hyaku Shiki)
Level2=3604022,3604024,3604004,3604005,3604006,3604002
; lv3: mobile armors (Val-Walo, Big-Zam, Psycho Gundam, Apsalus II)
Level3=3604015,3604016,3604017,3604018
; lv4/lv5: NpcPoint 5 (Strike Freedom, Zeta awakened, Crossbone X3, Sandrock EW, Infinite
;      Justice, Seravee, Master Gundam, Deathscythe Hell EW, Heavy Arms EW, Neue Ziel)
Level4=3604001,3604003,3604008,3604009,3604019,3604021,3604027,3604025,3604014,3604013
Level5=3604001,3604003,3604008,3604009,3604019,3604021,3604027,3604025,3604014,3604013
