; Verified symbols for GOnline.exe (TimeDateStamp 0x54BE1568, SizeOfImage 0x00C97000,
; sha256 e2dba73c10302b50cb0e6f2e58dd0a14effa8d224989ae570a7f8e05af79ff92).
; The image has no relocations and always loads at 0x00400000; rva = VA - 0x00400000.
;
; Every code/site entry carries the bytes that were read from this exact build. The core
; compares them at startup and refuses entries that do not match, so a different client
; build or a conflicting patch disables the dependent mods instead of corrupting the game.
; Check this file offline with: python tools/verify_symbols.py <path to GOnline.exe>
;
; Values must not carry inline comments; put notes on their own lines.

[host]
image=GOnline.exe
timestamp=0x54BE1568
size_of_image=0x00C97000

; ---- Mission mode --------------------------------------------------------------------

; CMissionMode::Update, per-frame update of the co-op mission game mode.
; void __thiscall (no stack arguments), single return at VA 0x00AD5373.
; Slot 6 of the CMissionMode vftable (VA 0x00EC3084, RTTI .?AVCMissionMode@@).
; It is the only reference to CMissionMode::Update in the image.
[CMissionMode.vtbl.Update]
kind=slot
rva=0x00AC309C
target_rva=0x006D38B0

; ---- Spawning a room's AI participants (CAINormalGameMode::Init AI loop 0x004049B3) -----

; void __thiscall CMissionMode::Init(void), no stack arguments. Spawns the room's humans
; (room+0x1C records); AI participants (room+0x3C) are left to the AI battle modes.
[CMissionMode.Init]
kind=code
rva=0x006D5830
expect=55 8B EC 6A FF 68 07 75 E0 00 64 A1 00 00 00 00

; CMissionMode's own vftable (RTTI .?AVCMissionMode@@); slot 0x18 = CMissionMode.vtbl.Update.
[CMissionMode.vtbl]
kind=data
rva=0x00AC3084

