; ---- Respawn (per-room battle tick) ---------------------------------------------------

; void __thiscall BattleEnd(ushort, ushort, int now), ret 0xC (room in ecx): the battle state
; machine's end (0x00481C90) and two other end paths call it. Runs the mode's result routine
; (results sent, room back to waiting via 0x004848D0) and then releases every pilot's battle
; state (0x0047DF90). The expect stops before mov eax, [0x008288E0] (relocated under ASLR).
[battle.end]
kind=code
rva=0x0007E4A0
expect=55 8B EC 83 EC 58

; int __thiscall RoomTick(battle room; u32 now), ret 4. Walks the 12 slots: a dead human
; pilot (unit +0x34 HP == 0) is respawned with battle.respawn_pilot and, once alive,
; refreshed with battle.respawn_refresh(0, pilot, 0, 0) and battle.pilot_state_respawn on
; pilot +0x1D90. Dead AI pilots (id bit 31) are respawned only in room modes 11 and 12.
[battle.room_tick]
kind=code
rva=0x000884D0
expect=55 8B EC 83 EC 20 89 4D E0 C7 45 F4 00 00 00 00

; int __thiscall RespawnPilot(battle room; u32 now, pilot*, pilot id, slot info +0x472),
; ret 0x10: when the pilot's respawn time (pilot +0x34) has passed and its mode allows it,
; spends the unit cost from pilot +0x1E and restores the unit's HP. Non-zero on success.
[battle.respawn_pilot]
kind=code
rva=0x00087030
expect=55 8B EC 83 EC 74

