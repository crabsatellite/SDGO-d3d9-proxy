; Verified symbols for BattleServer.exe (TimeDateStamp 0x548A891D, SizeOfImage 0x0046C000,
; sha256 f74d16037fc8f4fe49a8041488aabd1948df1b1a9f2d125de9dad4a2347b63a4).
; The image is DYNAMIC_BASE (ASLR): rva = VA - 0x00400000 (preferred base). Expected bytes
; therefore never include absolute addresses, which the loader relocates.
; Check offline with: python tools/verify_symbols.py <path to BattleServer.exe>
;
; Values must not carry inline comments; put notes on their own lines.

[host]
image=BattleServer.exe
timestamp=0x548A891D
size_of_image=0x0046C000

; ---- Battle start of a co-op mission room ---------------------------------------------

; Announces a battle start to the room (pilot of every slot with an id). void __thiscall
; (battle-room proc; room, key, index, a, b), ret 0x14. Its first bytes after the push
; are a relocated handler address, so only the prologue is pinned.
[battle.start_notify]
kind=code
rva=0x000B61E0
expect=55 8B EC 6A FF 68

; Callers (static): the AI battle starts 0x004B79D0 (mode 11) and 0x004B88E0 (mode 12),
; 0x004E2CA0 (modes 13/14 only, error 0xFAF otherwise) and the general path of the
; battle-start dispatcher (0x004BA513), which is the only one for co-op missions (room
; mode 5, 8, 10: the modes it exempts from team checks at 0x004B9ED5/0x004BA146 and the
; client runs as CMissionMode). SDBattlePlus.dll detours that call site at run time and
; calls the announcer from its own stub, so the call site is not a usable symbol.

; ---- AI pilots, as the AI battle modes add them (0x004B79D0 mode 11, 0x004B88E0 mode 12) --

; Pointer to the AI-NPC list (DLockList<AiModeNpcData*>): +0x4 head node, +0x8 end node,
; +0xC count; node +0x0 data pointer (data +0x0 = NPC data id), node +0x8 next.
[battle.ai_npc_list]
kind=data
rva=0x00435CC4

; The CWaitRoomProc instance the battle-start code runs on (this of 0x004B9BF0).
[battle.waitroom_proc]
kind=data
rva=0x00435CE0

; int __thiscall BuildAiPilot(room; BattlePilot* pilot, unit record*, NPC data id), ret 0xC.
; Fills the pilot (id with bit 31 set) and its unit from the AI NPC.
[battle.build_ai_pilot]
kind=code
rva=0x00085720
expect=55 8B EC 83 EC 1C 89 4D E4 83 7D 08 00 74 06 83

; void __thiscall (pilot + 0x1CE0), no stack arguments.
[battle.pilot_reset]
kind=code
rva=0x00063300
expect=55 8B EC 51 89 4D FC 8B 45 FC C6 00 00 8B 4D FC

; void __thiscall (pilot + 0x1D90; pilot id), ret 4.
[battle.pilot_state_id]
kind=code
rva=0x00078BA0
expect=55 8B EC 83 EC 08 89 4D F8 8B 45 F8 C6 00 00 8B

; void __thiscall (pilot + 0x1D90; battle room), ret 4.
[battle.pilot_state_room]
kind=code
rva=0x00079950
expect=55 8B EC 83 EC 08 89 4D F8 8B 45 F8 8B 4D 08 89

; void __thiscall (pilot + 0x1D90; room byte +4, room byte +5), ret 8.
[battle.pilot_state_mode]
kind=code
rva=0x000795B0
expect=55 8B EC 83 EC 0C 89 4D F4 8B 45 F4 8A 4D 08 88

; int __thiscall SetupAiPilot(waitroom proc; slot info*, pilot*, room byte +4, room byte +5),
; ret 0x10. Non-zero on success.
[battle.setup_ai_pilot]
kind=code
rva=0x000D7A10
expect=55 8B EC 83 EC 20 89 4D E0 C7 45 EC 00 00 00 00

