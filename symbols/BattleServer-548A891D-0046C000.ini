; ---- Hard AI battle items -------------------------------------------------------------

; int __thiscall CWaitRoomProc::Tick(), no stack arguments. It locks and ticks every
; active battle room, releases each room, then returns. pvp_ai drains queued item actions
; only after this original function has released all room locks.
[items.waitroom_tick]
kind=code
rva=0x000B2960
expect=55 8B EC 81 EC 5C 01 00 00

; Authoritative damage wrapper: room in ecx, twelve stack arguments, ret 0x30. pvp_ai
; compares the current-form HP immediately before and after the original call, so immunity,
; shield-only contact and rejected damage do not trigger an item.
[items.accepted_damage]
kind=code
rva=0x000A0300
expect=55 8B EC 81 EC 6C 01 00 00 89 8D A4 FE FF FF

