; Verified symbols for BattleServer.exe (TimeDateStamp 0x548A891D, SizeOfImage 0x0046C000,
; sha256 f74d16037fc8f4fe49a8041488aabd1948df1b1a9f2d125de9dad4a2347b63a4).
; The image is DYNAMIC_BASE (ASLR): rva = VA - 0x00400000 (preferred base). Expected bytes
; therefore never include absolute addresses, which the loader relocates.
; Check offline with: python tools/verify_symbols.py <path to BattleServer.exe>
;
; Values must not carry inline comments; put notes on their own lines.

[host]
image=BattleServer.exe
timestamp=0x548A891D
size_of_image=0x0046C000

; ---- Battle start of a co-op mission room ---------------------------------------------

; Announces a battle start to the room (pilot of every slot with an id). void __thiscall
; (battle-room proc; room, key, index, a, b), ret 0x14. Its first bytes after the push
; are a relocated handler address, so only the prologue is pinned.
[battle.start_notify]
kind=code
rva=0x000B61E0
expect=55 8B EC 6A FF 68

; Callers (static): the AI battle starts 0x004B79D0 (mode 11) and 0x004B88E0 (mode 12),
; 0x004E2CA0 (modes 13/14 only, error 0xFAF otherwise) and the general path of the
; battle-start dispatcher (0x004BA513), which is the only one for co-op missions (room
; mode 5, 8, 10: the modes it exempts from team checks at 0x004B9ED5/0x004BA146 and the
; client runs as CMissionMode). SDBattlePlus.dll detours that call site at run time and
; calls the announcer from its own stub, so the call site is not a usable symbol.

; ---- Battle start of a PvP room (general path of the dispatcher 0x004B9BF0) ------------

; Player count check of the dispatcher: every room but a co-op mission (mode 5, 8, 10, which
; jump from here to battle.start_size_checked) needs 2..12 players in the room (room +0x71
; is the current player count, kept by the join/leave code 0x0047AE90/0x0047B020); else
; error 0xFBA. Hooked mid-function (naked detour), same frame as battle.start_team_checks.
; movzx eax, [ebp-0x328A7] / cmp eax, 5 / je rel8: position independent.
[battle.start_size_check]
kind=code
rva=0x000B9ED5
expect=0F B6 85 59 D7 FC FF 83 F8 05 74 51

; Where co-op mission rooms continue after the player count check: movzx eax,
; [ebp-0x32894] / test eax, eax / jne.
[battle.start_size_checked]
kind=site
rva=0x000B9F32
expect=0F B6 85 6C D7 FC FF 85 C0 75 3C

; Team layout checks after the per-slot loop of the dispatcher. Co-op mission rooms (mode
; 5, 8, 10) jump from here straight to battle.start_checks_passed; every other room needs
; equal numbers of humans per team (unless room +4 is 1) and at least three per team in
; modes 3, 6, 7, 9, or an even player count when room +8 is set. AI pilots are not counted.
; Hooked mid-function (naked detour); the dispatcher frame holds its room copy at
; ebp-0x328AC. movzx ecx, [ebp-0x328A7] / cmp ecx, 5 / je rel32: position independent.
[battle.start_team_checks]
kind=code
rva=0x000BA146
expect=0F B6 8D 59 D7 FC FF 83 F9 05 0F 84 79 01 00 00

; Where the team checks end for co-op mission rooms: mov eax, [ebp-0x328D0] / movzx ecx,
; word [eax] / push ecx (the battle-room lookup that follows).
[battle.start_checks_passed]
kind=site
rva=0x000BA2CF
expect=8B 85 30 D7 FC FF 0F B7 08 51

; int __thiscall SetupBattlePilots(waitroom proc; battle room, u32* out, u32* out, u8),
; ret 0x10: clears every pilot record (room +0x3CE4, 0x2B138 bytes), then sets up the pilot
; of every slot as a human (no AI branch). 0 on success, else an error code (0xFBE). Only
; caller: the dispatcher's general path (0x004BA410). The prologue is followed by a load
; of the relocated cookie address, so only the prologue is pinned.
[battle.setup_humans]
kind=code
rva=0x000B6EB0
expect=55 8B EC 83 EC 78

; ---- Respawn (per-room battle tick) ---------------------------------------------------

; int __thiscall RoomTick(battle room; u32 now), ret 4. Walks the 12 slots: a dead human
; pilot (unit +0x34 HP == 0) is respawned with battle.respawn_pilot and, once alive,
; refreshed with battle.respawn_refresh(0, pilot, 0, 0) and battle.pilot_state_respawn on
; pilot +0x1D90. Dead AI pilots (id bit 31) are respawned only in room modes 11 and 12.
[battle.room_tick]
kind=code
rva=0x000884D0
expect=55 8B EC 83 EC 20 89 4D E0 C7 45 F4 00 00 00 00

; int __thiscall RespawnPilot(battle room; u32 now, pilot*, pilot id, slot info +0x472),
; ret 0x10: when the pilot's respawn time (pilot +0x34) has passed and its mode allows it,
; spends the unit cost from pilot +0x1E and restores the unit's HP. Non-zero on success.
[battle.respawn_pilot]
kind=code
rva=0x00087030
expect=55 8B EC 83 EC 74

; void __thiscall (battle room; 0, pilot*, 0, 0), ret 0x10: the refresh the room tick runs
; for a respawned human pilot.
[battle.respawn_refresh]
kind=code
rva=0x00088830
expect=55 8B EC 81 EC C4 00 00 00

; int __thiscall (pilot + 0x1D90), no stack arguments: run after battle.respawn_refresh.
[battle.pilot_state_respawn]
kind=code
rva=0x00078D00
expect=55 8B EC 51 89 4D FC 8B 45 FC 0F B6 48 03 85 C9

; ---- AI pilots, as the AI battle modes add them (0x004B79D0 mode 11, 0x004B88E0 mode 12) --

; Pointer to the AI-NPC list (DLockList<AiModeNpcData*>): +0x4 head node, +0x8 end node,
; +0xC count; node +0x0 data pointer (data +0x0 = NPC data id), node +0x8 next.
[battle.ai_npc_list]
kind=data
rva=0x00435CC4

; The CWaitRoomProc instance the battle-start code runs on (this of 0x004B9BF0).
[battle.waitroom_proc]
kind=data
rva=0x00435CE0

; int __thiscall BuildAiPilot(room; BattlePilot* pilot, unit record*, NPC data id), ret 0xC.
; Fills the pilot (id with bit 31 set) and its unit from the AI NPC.
[battle.build_ai_pilot]
kind=code
rva=0x00085720
expect=55 8B EC 83 EC 1C 89 4D E4 83 7D 08 00 74 06 83

; void __thiscall (pilot + 0x1CE0), no stack arguments.
[battle.pilot_reset]
kind=code
rva=0x00063300
expect=55 8B EC 51 89 4D FC 8B 45 FC C6 00 00 8B 4D FC

; void __thiscall (pilot + 0x1D90; pilot id), ret 4.
[battle.pilot_state_id]
kind=code
rva=0x00078BA0
expect=55 8B EC 83 EC 08 89 4D F8 8B 45 F8 C6 00 00 8B

; void __thiscall (pilot + 0x1D90; battle room), ret 4.
[battle.pilot_state_room]
kind=code
rva=0x00079950
expect=55 8B EC 83 EC 08 89 4D F8 8B 45 F8 8B 4D 08 89

; void __thiscall (pilot + 0x1D90; room byte +4, room byte +5), ret 8.
[battle.pilot_state_mode]
kind=code
rva=0x000795B0
expect=55 8B EC 83 EC 0C 89 4D F4 8B 45 F4 8A 4D 08 88

; int __thiscall SetupAiPilot(waitroom proc; slot info*, pilot*, room byte +4, room byte +5),
; ret 0x10. Non-zero on success.
[battle.setup_ai_pilot]
kind=code
rva=0x000D7A10
expect=55 8B EC 83 EC 20 89 4D E0 C7 45 EC 00 00 00 00

; ---- Lobby rooms (WaitRoom records, 0x2218 bytes; title length +0x53, title +0x54) -----

